version: 2.1

ci_base_image: &ci_base_image darthjee/circleci_pidgey-base:0.0.3

executors:
  pidgey-base:
    docker:
      - image: *ci_base_image

commands:
  prepare_source:
    description: Checkout and keep only the source/ folder at the root
    steps:
      - checkout
      - run:
          name: Set folder
          command: mv source old; mv old/* ./; rm -rf old

  composer_setup:
    description: Copy pre-installed vendor folder and run composer install
    steps:
      - run:
          name: Copy dependencies
          command: cp /home/circleci/vendor/ ./vendor/ -R
      - run:
          name: composer install
          command: composer install --no-interaction --no-progress

  upload_codacy_coverage:
    description: Rewrite coverage paths to be repo-relative and upload a partial report to Codacy
    parameters:
      report:
        type: string
        description: Path to the coverage report, relative to the job's working dir
      prefix:
        type: string
        description: Repo folder the job flattened to the root (e.g. source or frontend)
    steps:
      - run:
          name: Rewrite coverage paths to be repo-relative
          command: |
            set -e
            ROOT_ESCAPED=$(printf '%s/' "$(pwd)" | sed -e 's/[][\.^$*+?(){}|]/\\&/g')
            sed -E -i \
              -e "s|${ROOT_ESCAPED}|<< parameters.prefix >>/|g" \
              -e 's|^SF:\./|SF:<< parameters.prefix >>/|' \
              -e '/^SF:(\/|<< parameters.prefix >>\/)/!s|^SF:|SF:<< parameters.prefix >>/|' \
              << parameters.report >>
            grep -m3 -E 'SF:|file name=' << parameters.report >> || echo "No path lines found in << parameters.report >>"
      - run:
          name: Upload partial coverage to Codacy
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -r << parameters.report >>

  deploy_setup:
    description: Fail early without SSH_KNOWN_HOSTS, then write the SSH key files
    steps:
      - run:
          name: Check SSH_KNOWN_HOSTS
          command: if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then echo "SSH_KNOWN_HOSTS is not set" >&2; exit 1; fi
      - run:
          name: Generate SSH key file
          command: deploy_frontend.sh generate_key_file

jobs:
  backend_checks:
    executor: pidgey-base
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Run Lint
          command: composer lint

  backend_tests:
    docker:
      - image: *ci_base_image
        environment:
          PHP_ENV: test
          DB_HOST: mysql
          DB_PORT: 3306
          DB_NAME: pidgey_test
          DB_USER: root
          DB_PASSWORD: root
          SMTP_HOST: mailpit
          SMTP_PORT: 1025
      - image: mysql:9
        name: mysql
        environment:
          MYSQL_ROOT_PASSWORD: root
      - image: axllent/mailpit
        name: mailpit
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Prepare database
          command: composer db:prepare
      - run:
          name: Tests
          command: composer coverage
      - upload_codacy_coverage:
          report: coverage/clover.xml
          prefix: source

  frontend_checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: mv frontend /tmp/frontend; rm -rf ./*; cp -R /tmp/frontend/. ./
      - run:
          name: Yarn install
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Tests
          command: npm run coverage
      - upload_codacy_coverage:
          report: coverage/lcov.info
          prefix: frontend

  coverage_final:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - run:
          name: Finalize Codacy coverage
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) final

  build_backend:
    executor: pidgey-base
    steps:
      - checkout
      - run:
          name: Keep only source/ as backend/
          command: mv source backend
      - run:
          name: Copy dependencies
          working_directory: backend
          command: cp /home/circleci/vendor/ ./vendor/ -R
      - run:
          name: composer install (production)
          working_directory: backend
          command: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - persist_to_workspace:
          root: .
          paths:
            - backend

  build_frontend:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: mv frontend /tmp/frontend; rm -rf ./*; cp -R /tmp/frontend/. ./
      - run:
          name: Yarn install
          command: yarn install --frozen-lockfile
      - run:
          name: Build
          command: yarn build
      - run:
          name: Move build output
          command: mv dist frontend-dist
      - persist_to_workspace:
          root: .
          paths:
            - frontend-dist

  upload_backend:
    executor: pidgey-base
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - deploy_setup
      - run:
          name: Upload backend
          command: SOURCE=/tmp/workspace/backend/ EXCLUDE_FROM=.circleci/backend-exclude.txt deploy_frontend.sh upload

  upload_frontend:
    executor: pidgey-base
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - deploy_setup
      - run:
          name: Upload frontend
          command: SOURCE=/tmp/workspace/frontend-dist/ DEPLOY_PATH=public/admin/ deploy_frontend.sh upload

  release:
    executor: pidgey-base
    steps:
      - deploy_setup
      - run:
          name: Link shared .env
          command: SOURCE="$REMOTE_HOME/$SHARED_DIR/.env" DEPLOY_PATH=config/.env deploy_frontend.sh link
      - run:
          name: Check configuration
          command: COMMAND="$PHP_BIN bin/check-config" deploy_frontend.sh run
      - run:
          name: Run migrations
          command: COMMAND="$PHP_BIN bin/migrate" deploy_frontend.sh run
      - run:
          name: Release
          command: deploy_frontend.sh release
      - run:
          name: Cleanup
          command: deploy_frontend.sh cleanup

all_tags: &all_tags
  tags:
    only: /.*/

deploy_tags: &deploy_tags
  tags:
    only: /^\d+\.\d+\.\d+$/
  branches:
    ignore: /.*/

workflows:
  main:
    jobs:
      - backend_checks:
          filters: *all_tags
      - backend_tests:
          filters: *all_tags
      - frontend_checks:
          filters: *all_tags
      - coverage_final:
          requires: [backend_tests, frontend_checks]
          filters: *all_tags
      - build_backend:
          requires: [backend_checks, backend_tests, frontend_checks]
          filters: *deploy_tags
      - build_frontend:
          requires: [backend_checks, backend_tests, frontend_checks]
          filters: *deploy_tags
      - upload_backend:
          requires: [build_backend]
          context: pidgey-deploy
          serial-group: << pipeline.project.slug >>/pidgey-deploy
          filters: *deploy_tags
      - upload_frontend:
          requires: [build_frontend, upload_backend]
          context: pidgey-deploy
          serial-group: << pipeline.project.slug >>/pidgey-deploy
          filters: *deploy_tags
      - release:
          requires: [upload_backend, upload_frontend]
          context: pidgey-deploy
          serial-group: << pipeline.project.slug >>/pidgey-deploy
          filters: *deploy_tags
