version: 2.1

executors:
  pidgey-base:
    docker:
      - image: darthjee/circleci_pidgey-base:0.0.1

commands:
  prepare_source:
    description: Checkout and keep only the source/ folder at the root
    steps:
      - checkout
      - run:
          name: Set folder
          command: mv source old; mv old/* ./; rm -rf old

  composer_setup:
    description: Copy pre-installed vendor folder and run composer install
    steps:
      - run:
          name: Copy dependencies
          command: cp /home/circleci/vendor/ ./vendor/ -R
      - run:
          name: composer install
          command: composer install --no-interaction --no-progress

  upload_codacy_coverage:
    description: Rewrite coverage paths to be repo-relative and upload a partial report to Codacy
    parameters:
      report:
        type: string
        description: Path to the coverage report, relative to the job's working dir
      prefix:
        type: string
        description: Repo folder the job flattened to the root (e.g. source or frontend)
    steps:
      - run:
          name: Rewrite coverage paths to be repo-relative
          command: |
            set -e
            ROOT_ESCAPED=$(printf '%s/' "$(pwd)" | sed -e 's/[][\.^$*+?(){}|]/\\&/g')
            sed -E -i \
              -e "s|${ROOT_ESCAPED}|<< parameters.prefix >>/|g" \
              -e 's|^SF:\./|SF:<< parameters.prefix >>/|' \
              -e '/^SF:(\/|<< parameters.prefix >>\/)/!s|^SF:|SF:<< parameters.prefix >>/|' \
              << parameters.report >>
            grep -m3 -E 'SF:|file name=' << parameters.report >> || echo "No path lines found in << parameters.report >>"
      - run:
          name: Upload partial coverage to Codacy
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -r << parameters.report >>

jobs:
  backend_checks:
    executor: pidgey-base
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Run Lint
          command: composer lint

  backend_tests:
    docker:
      - image: darthjee/circleci_pidgey-base:0.0.1
        environment:
          PHP_ENV: test
          DB_HOST: mysql
          DB_PORT: 3306
          DB_NAME: pidgey_test
          DB_USER: root
          DB_PASSWORD: root
          SMTP_HOST: mailpit
          SMTP_PORT: 1025
      - image: mysql:9
        name: mysql
        environment:
          MYSQL_ROOT_PASSWORD: root
      - image: axllent/mailpit
        name: mailpit
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Prepare database
          command: composer db:prepare
      - run:
          name: Tests
          command: composer coverage
      - upload_codacy_coverage:
          report: coverage/clover.xml
          prefix: source

  frontend_checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: mv frontend /tmp/frontend; rm -rf ./*; cp -R /tmp/frontend/. ./
      - run:
          name: Yarn install
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Tests
          command: npm run coverage
      - upload_codacy_coverage:
          report: coverage/lcov.info
          prefix: frontend

  coverage_final:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - run:
          name: Finalize Codacy coverage
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) final

all_tags: &all_tags
  tags:
    only: /.*/

workflows:
  main:
    jobs:
      - backend_checks:
          filters: *all_tags
      - backend_tests:
          filters: *all_tags
      - frontend_checks:
          filters: *all_tags
      - coverage_final:
          requires: [backend_tests, frontend_checks]
          filters: *all_tags
