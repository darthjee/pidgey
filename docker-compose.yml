x-base: &base
  image: darthjee/dev_pidgey
  env_file: .env
  volumes:
    - ./source:/home/app/app
    - ./docker_volumes/vendor:/home/app/app/vendor

services:
  base_build:
    <<: *base
    build:
      context: source
      dockerfile: ../dockerfiles/dev_pidgey/Dockerfile
      args:
        BASE_VERSION: ${BASE_VERSION:-0.0.1}
        BASE_SUFFIX: ${BASE_SUFFIX:-}
    command: "true"

  app:
    <<: *base
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PHP_ENV: development
    depends_on:
      - base_build
      - mysql
    command: apache2-foreground

  tests:
    <<: *base
    environment:
      PHP_ENV: test
      DB_NAME: pidgey_test
      TEST_MAILPIT_PLAIN: mailpit-plain:2025:9025
      TEST_MAILPIT_STARTTLS: mailpit-starttls:2587:9587
      TEST_MAILPIT_SSL: mailpit-ssl:2465:9465
      SMTP_ALLOW_PRIVATE_HOSTS: "true"
      SMTP_CA_FILE: tests/fixtures/tls/ca.pem
    depends_on:
      - base_build
      - mysql
      - mailpit-plain
      - mailpit-starttls
      - mailpit-ssl

  mysql:
    image: mysql:9
    env_file: .env
    volumes:
      - ./docker_volumes/mysql_data:/var/lib/mysql
      - ./dockerfiles/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Test-only Mailpit instances (see docs/agents/specs/email/testing.md).
  # They publish no host ports; the tests service reaches them by name.
  mailpit-plain:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:2025
      MP_UI_BIND_ADDR: 0.0.0.0:9025

  mailpit-starttls:
    image: axllent/mailpit:v1.32.0
    volumes:
      - ./source/tests/fixtures/tls:/fixtures/tls:ro
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:2587
      MP_UI_BIND_ADDR: 0.0.0.0:9587
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_TLS_CERT: /fixtures/tls/server.pem
      MP_SMTP_TLS_KEY: /fixtures/tls/server-key.pem
      MP_SMTP_AUTH: pidgey-test:pidgey-test-password

  mailpit-ssl:
    image: axllent/mailpit:v1.32.0
    volumes:
      - ./source/tests/fixtures/tls:/fixtures/tls:ro
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:2465
      MP_UI_BIND_ADDR: 0.0.0.0:9465
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_TLS_CERT: /fixtures/tls/server.pem
      MP_SMTP_TLS_KEY: /fixtures/tls/server-key.pem
      MP_SMTP_AUTH: pidgey-test:pidgey-test-password

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "${PHPMYADMIN_PORT:-8040}:80"
    depends_on:
      - mysql

  frontend_dev:
    image: darthjee/vite_pidgey
    build:
      context: .
      dockerfile: dockerfiles/vite_pidgey/Dockerfile
      args:
        BASE_VERSION: ${FE_BASE_VERSION:-0.0.1}
        BASE_SUFFIX: ${BASE_SUFFIX:-}
    working_dir: /home/node/app
    volumes:
      - ./frontend:/home/node/app
      - ./docker_volumes/node_modules:/home/node/app/node_modules
    ports:
      - "${FRONTEND_PORT:-8030}:8080"
    depends_on:
      - app
    command: yarn server
